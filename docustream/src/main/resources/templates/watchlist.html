<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Watchlist · DocuStream</title><link rel="stylesheet" href="/style.css"></head><body><header th:replace="~{fragments :: nav}"></header><main><p class="notice" role="status" th:if="${message}" th:text="${message}"></p><h1>Your watchlist</h1><section class="grid"><article class="card" th:each="d : ${items}"><div class="art" th:text="${d.GENRE}"></div><h2 th:text="${d.TITLE}"></h2><p th:text="${d.DESCRIPTION}"></p><a class="button" th:href="@{/docs/{id}(id=${d.ID})}">View documentary</a></article></section><p th:if="${#lists.isEmpty(items)}">No documentaries found.</p><form class="inline" th:each="d : ${items}" th:action="@{/watchlist/{id}(id=${d.ID})}" method="post"><input type="hidden" name="remove" value="true"><button class="secondary" th:text="'Remove ' + ${d.TITLE}"></button></form></main><footer>DocuStream · Stories that stay with you.</footer></body></html>
