<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Watch · DocuStream</title><link rel="stylesheet" href="/style.css"></head><body><header th:replace="~{fragments :: nav}"></header><main><p class="notice" role="status" th:if="${message}" th:text="${message}"></p><p class="eyebrow" th:text="${doc.GENRE}"></p><h1 th:text="${doc.TITLE}"></h1><p th:text="${doc.DESCRIPTION}"></p><video controls preload="metadata" th:src="${doc.MEDIA}">Your browser does not support video playback.</video><p class="muted">If the video is unavailable, please try again later.</p><form th:action="@{/watchlist/{id}(id=${doc.ID})}" method="post"><button>Add to watchlist</button></form></main><footer>DocuStream · Stories that stay with you.</footer></body></html>
