<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Documentaries · DocuStream</title><link rel="stylesheet" href="/style.css"></head><body><header th:replace="~{fragments :: nav}"></header><main><p class="notice" role="status" th:if="${message}" th:text="${message}"></p><p class="eyebrow">THE COLLECTION</p><h1>Documentaries</h1><form class="filters" th:action="@{/docs}" method="get"><label>Title<input name="q" th:value="${q}" maxlength="150" placeholder="Search titles"></label><label>Genre<select name="genre"><option value="">All genres</option><option th:each="g : ${ {'Nature','History','Science'} }" th:value="${g}" th:text="${g}" th:selected="${g == genre}"></option></select></label><button>Search</button></form><p class="muted">Explore the collection and save your favourites.</p><section class="grid"><article class="card" th:each="d : ${items}"><div class="art" th:text="${d.GENRE}"></div><h2 th:text="${d.TITLE}"></h2><p th:text="${d.DESCRIPTION}"></p><a class="button" th:href="@{/docs/{id}(id=${d.ID})}">View documentary</a></article></section><p th:if="${#lists.isEmpty(items)}">No documentaries found.</p></main><footer>DocuStream · Stories that stay with you.</footer></body></html>
