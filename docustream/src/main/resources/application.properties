spring.application.name=docustream
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/docustream?connectionTimeZone=LOCAL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=DOCUSTREAM_SESSION
server.port=${PORT:8080}

server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
spring.mvc.log-request-details=false
server.tomcat.accesslog.enabled=false
server.tomcat.max-http-form-post-size=32KB
server.max-http-request-header-size=16KB
